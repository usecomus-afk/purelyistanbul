name: Build purelyİstanbul iOS App (.ipa for Sideloadly)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'purelyİstanbul Canli Sunucu URL (Orn: https://www.purelyistanbul.com - Bos birakilirsa varsayilan kullanilir)'
        required: false
        default: ''
      create_release:
        description: 'GitHub Releases uzerinde surum yayinla'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build purelyİstanbul iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Configure Server URL
        run: |
          if [ -n "${{ inputs.server_url }}" ]; then
            echo "Custom Server URL specified: ${{ inputs.server_url }}"
            TARGET_URL="${{ inputs.server_url }}"
          else
            echo "Setting default live server URL: https://purelyistanbul.com"
            TARGET_URL="https://purelyistanbul.com"
          fi
          echo "CAPACITOR_SERVER_URL=$TARGET_URL" >> $GITHUB_ENV
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            c.server = c.server || {};
            c.server.url = '$TARGET_URL';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
            console.log('Updated capacitor.config.json server.url to:', c.server.url);
          "

      - name: Sync Capacitor iOS Platform
        run: |
          npx cap sync ios

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Build iOS App (.app)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            PROJECT_ARG="-workspace ios/App/App.xcworkspace"
          else
            PROJECT_ARG="-project ios/App/App.xcodeproj"
          fi
          xcodebuild \
            $PROJECT_ARG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload into unsigned .ipa
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/ipa/Payload/

          # Guarantee explicit icons in App.app root for SpringBoard & Sideloadly
          cp ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-60x60@2x.png build/ipa/Payload/App.app/AppIcon60x60@2x.png || true
          cp ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-60x60@3x.png build/ipa/Payload/App.app/AppIcon60x60@3x.png || true
          cp ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-76x76@2x.png build/ipa/Payload/App.app/AppIcon76x76@2x~ipad.png || true
          cp ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png build/ipa/Payload/App.app/AppIcon-512@2x.png || true
          cp ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png build/ipa/Payload/App.app/iTunesArtwork@2x || true
          cp public/itunes-512.png build/ipa/Payload/App.app/iTunesArtwork || true

          # Sideloadly and iTunes use iTunesArtwork at the root of the .ipa for desktop preview and device icon sync
          cp public/itunes-512.png build/ipa/iTunesArtwork
          cp ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png build/ipa/iTunesArtwork@2x

          cd build/ipa
          zip -r -9 ../../purelyİstanbul.ipa Payload iTunesArtwork iTunesArtwork@2x
          cd ../..
          cp purelyİstanbul.ipa purelyistanbul.ipa
          cp purelyİstanbul.ipa Xenios.ipa
          ls -lh purelyİstanbul.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: purelyIstanbul-iOS-IPA
          path: purelyİstanbul.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'purelyİstanbul iOS App (Sideloadly IPA)' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-ios' }}
          files: |
            purelyİstanbul.ipa
            Xenios.ipa
          body: |
            ## 🏛️ purelyİstanbul iOS Mobil Uygulaması (.ipa)
            
            Bu sürüm **Sideloadly** veya benzeri sideload araçları (AltStore, TrollStore, Scarlet) ile iPhone / iPad cihazlara doğrudan yüklenmek üzere hazırlanmıştır.
            
            ### 🚀 Kurulum Adımları (Sideloadly):
            1. Yukarıdaki `purelyİstanbul.ipa` dosyasını bilgisayarınıza indirin.
            2. Bilgisayarınızda [Sideloadly](https://sideloadly.io/) programını açın ve iPhone'unuzu kablo ile bağlayın.
            3. İndirdiğiniz `purelyİstanbul.ipa` dosyasını Sideloadly penceresine sürükleyip bırakın.
            4. Apple ID e-postanızı girin ve **Start** butonuna tıklayın.
            5. Yükleme tamamlandıktan sonra iPhone'unuzda:
               - **Ayarlar > Genel > VPN ve Aygıt Yönetimi** bölümüne gidin.
               - Kendi Apple ID'nizi seçin ve **Güven ("Trust")** seçeneğine dokunun.
               - (iOS 16+ için) **Ayarlar > Gizlilik ve Güvenlik > Geliştirici Modu**'nu aktif edin ve telefonu yeniden başlatın.
            6. purelyİstanbul uygulamasını açıp kullanmaya başlayın!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
