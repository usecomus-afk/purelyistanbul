name: Deploy Purely Admin iOS App to TestFlight

on:
  push:
    tags:
      - 'v*-admin*'
      - 'admin-v*'
  workflow_dispatch:
    inputs:
      admin_bundle_id:
        description: 'Apple Developer Bundle ID for Purely Admin App'
        required: false
        default: 'com.usecomus.purelyadmin.R8LQC6KZG8'

jobs:
  deploy-admin:
    name: Build & Deploy Purely Admin (/admin) to TestFlight
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Configure Capacitor for Purely Admin (/admin)
        env:
          BUNDLE_ID: ${{ inputs.admin_bundle_id || 'com.usecomus.purelyadmin.R8LQC6KZG8' }}
        run: |
          npm run build
          node -e "
            const fs = require('fs');
            const bundleId = process.env.BUNDLE_ID || 'com.usecomus.purelyadmin.R8LQC6KZG8';
            const adminUrl = 'https://purelyistanbul--xenios-prod-c55cd.us-central1.hosted.app/admin';
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            cfg.appId = bundleId;
            cfg.appName = 'Purely Admin';
            cfg.server = {
              url: adminUrl,
              cleartext: true,
              allowNavigation: ['*']
            };
            cfg.ios = {
              contentInset: 'never',
              backgroundColor: '#F6F1E8',
              preferredContentMode: 'mobile'
            };
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          "
          CAPACITOR_SERVER_URL="https://purelyistanbul--xenios-prod-c55cd.us-central1.hosted.app/admin" npx cap sync ios
          node -e "
            const fs = require('fs');
            const bundleId = process.env.BUNDLE_ID || 'com.usecomus.purelyadmin.R8LQC6KZG8';
            const adminUrl = 'https://purelyistanbul--xenios-prod-c55cd.us-central1.hosted.app/admin';
            const p = 'ios/App/App/capacitor.config.json';
            if (fs.existsSync(p)) {
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              c.appId = bundleId;
              c.appName = 'Purely Admin';
              c.server = {
                url: adminUrl,
                cleartext: true,
                allowNavigation: ['*']
              };
              c.ios = {
                contentInset: 'never',
                backgroundColor: '#F6F1E8',
                preferredContentMode: 'mobile'
              };
              c.packageClassList = Array.from(new Set([...(c.packageClassList || []), 'XeniosNotificationPlugin']));
              fs.writeFileSync(p, JSON.stringify(c, null, '\t'));
            }
          "

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup SSH for Match
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Build & Upload Purely Admin to TestFlight
        run: bundle exec fastlane beta_admin
        env:
          ADMIN_BUNDLE_ID: ${{ inputs.admin_bundle_id || 'com.usecomus.purelyadmin.R8LQC6KZG8' }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8_KEY: ${{ secrets.APPSTORE_P8_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Upload Signed PurelyAdmin IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PurelyAdmin-iOS-IPA
          path: build/PurelyAdmin.ipa
          retention-days: 30
