<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>purelyİstanbul</title>
  <style>
    :root {
      --bg: #0F1117;
      --card: #181B24;
      --border: #2B303C;
      --gold: #D4AF37;
      --gold-glow: rgba(212, 175, 55, 0.25);
      --text: #F8F6F0;
      --muted: #9BA1B0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 24px) 24px env(safe-area-inset-bottom, 24px);
    }
    .container {
      width: 100%;
      max-width: 360px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    .logo-wrap {
      position: relative;
      width: 88px;
      height: 88px;
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6), 0 0 24px var(--gold-glow);
      border: 1px solid rgba(212, 175, 55, 0.3);
      object-fit: cover;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-transform: none;
      margin-top: 4px;
    }
    p.desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    input {
      width: 100%;
      background: #0B0D13;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--gold);
    }
    .btn {
      width: 100%;
      background: var(--gold);
      color: #0F1117;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(212, 175, 55, 0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <img src="logo.png" alt="purelyİstanbul" class="logo" onerror="this.src='icon.png'" />
    </div>
    <div>
      <h1>purelyİstanbul</h1>
      <p class="desc">Misafir Deneyimi & Butik Otel Kokpiti</p>
    </div>

    <div class="card">
      <label for="serverUrl">Sunucu Bağlantı Adresi</label>
      <input type="url" id="serverUrl" placeholder="https://www.purelyistanbul.com" />
      <button class="btn" id="connectBtn" onclick="connect()">
        Uygulamayı Aç
      </button>
    </div>

    <div class="status" id="statusBox">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">purelyİstanbul sunucusuna bağlanıyor...</span>
    </div>
  </div>

  <script>
    const DEFAULT_URL = "https://www.purelyistanbul.com";
    const savedUrl = localStorage.getItem("purely_server_url") || DEFAULT_URL;
    const input = document.getElementById("serverUrl");
    input.value = savedUrl;

    function connect() {
      const url = input.value.trim();
      if (!url) return;
      localStorage.setItem("purely_server_url", url);
      document.getElementById("statusText").innerText = "Yönlendiriliyor...";
      window.location.replace(url);
    }

    // İlk açılışta otomatik yönlendirmeyi dene
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        if (savedUrl && !window.location.href.startsWith(savedUrl)) {
          window.location.replace(savedUrl);
        }
      }, 400);
    });
  </script>
</body>
</html>
